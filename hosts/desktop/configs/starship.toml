add_newline = false
format = "$directory$git_branch$git_status$package$nix_shell$nodejs$python$rust$dotnet$cmd_duration$line_break$character"
palette = "base16"
right_format = "$time"
scan_timeout = 30

[character]
error_symbol = "❯"
success_symbol = "❯"
vicmd_symbol = "❮"

[cmd_duration]
format = "[ $duration]($style) "
min_time = 500

[directory]
read_only = " "
truncate_to_repo = false
truncation_length = 3

[dotnet]
format = "via [$symbol$version]($style) "

[git_branch]
only_attached = false
symbol = " "
truncation_length = 20

[git_status]
ahead = " ⇡$count"
behind = " ⇣$count"
conflicted = " "
deleted = " "
diverged = " ⇕"
format = "[$all_status$ahead_behind]($style)"
modified = " "
renamed = " "
staged = " "
stashed = " "
untracked = " "

[jobs]
disabled = false
symbol = " "

[nix_shell]
format = "via [$symbol$name]($style) "
symbol = "❄️ "

[nodejs]
format = "via [$symbol$version]($style) "

[package]
display_private = true
symbol = "📦 "

[palettes.base16]
base00 = "#1e1e2e"
base01 = "#181825"
base02 = "#313244"
base03 = "#45475a"
base04 = "#585b70"
base05 = "#cdd6f4"
base06 = "#f5e0dc"
base07 = "#b4befe"
base08 = "#f38ba8"
base09 = "#fab387"
base0A = "#f9e2af"
base0B = "#a6e3a1"
base0C = "#94e2d5"
base0D = "#89b4fa"
base0E = "#cba6f7"
base0F = "#f2cdcd"
base10 = "#1e1e2e"
base11 = "#1e1e2e"
base12 = "#f38ba8"
base13 = "#f9e2af"
base14 = "#a6e3a1"
base15 = "#94e2d5"
base16 = "#89b4fa"
base17 = "#cba6f7"
black = "#1e1e2e"
blue = "#89b4fa"
bright-black = "#45475a"
bright-blue = "#89b4fa"
bright-cyan = "#94e2d5"
bright-green = "#a6e3a1"
bright-magenta = "#cba6f7"
bright-purple = "#cba6f7"
bright-red = "#f38ba8"
bright-white = "#b4befe"
bright-yellow = "#f9e2af"
brown = "#f2cdcd"
cyan = "#94e2d5"
green = "#a6e3a1"
magenta = "#cba6f7"
orange = "#fab387"
purple = "#cba6f7"
red = "#f38ba8"
white = "#cdd6f4"
yellow = "#f9e2af"

[python]
format = "via [${symbol}${pyenv_prefix}${version}]($style) "

[rust]
format = "via [$symbol$version]($style) "

[sudo]
disabled = false
format = "[sudo]($style) "

[time]
disabled = false
format = "[$time]($style)"
style = "bold"
time_format = "%H:%M"
use_12hr = false
